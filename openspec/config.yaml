schema: mysdd

context: |
  Treat propose, apply, verify, and archive as separate commit boundaries.
  After each operation succeeds, create a dedicated Git commit containing only
  that operation's changes before reporting completion. Follow AGENTS.md for
  inspection and commit-message rules. When verify succeeds without changing a
  tracked file, create an empty verification checkpoint commit.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
