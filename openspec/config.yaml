schema: mysdd

context: |
  - MUST; 計画、提案、新機能、破壊的変更、アーキテクチャ変更は OpenSpec ワークフローに従うこと
  - MUST; Git操作は `CONTRIBUTING.md` の規則に従うこと
  - MUST; proposeは必要な計画Artifactがすべて完成し、検証に成功した直後に、そのPhaseが所有する変更だけをCommitすること
  - MUST; applyは依頼されたTaskがすべて完成し、検証に成功した直後に、そのPhaseが所有する変更だけをCommitすること
  - MUST; verifyは検証完了直後に結果をCommitし、成功または失敗をCommit Messageへ明示すること。追跡対象Fileに変更がない場合はEmpty Commitを作成すること
  - MUST; archiveは必要なSpec同期、Change移動および検証に成功した直後に、そのPhaseが所有する変更だけをCommitすること
  - MUST; archiveのCommit後、`CONTRIBUTING.md` のPull RequestおよびCI条件を満たし、対象の `feature/*` Branchを `main` へMergeすること

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
